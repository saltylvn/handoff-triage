# Runs on every push to main and every pull request: the same checks you run locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to exact commits, because tags can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: Security audit (production dependencies)
        run: uv export --locked --no-dev --no-hashes --no-emit-project -o requirements-audit.txt -q && uv run pip-audit --disable-pip --no-deps -r requirements-audit.txt
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - name: End-to-end demo with fake services
        run: uv run python -m triage.demo
