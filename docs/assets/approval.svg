<circle cx="835" cy="231.0" r="4.5" fill="#161616" stroke="#8f8f8f" stroke-width="2"/>
<circle cx="925" cy="231.0" r="4.5" fill="#161616" stroke="#8f8f8f" stroke-width="2"/>
<rect x="627.7" y="312" width="208.6" height="26" rx="13" fill="#303030" stroke="#474747"/>
<text x="732" y="329.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#fafafa" text-anchor="middle">reject: nothing is written</text>
