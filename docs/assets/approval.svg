<circle cx="540" cy="231.0" r="4" fill="#0a0a0e" stroke="#6e6e78" stroke-width="1.6"/>
<circle cx="835" cy="231.0" r="4" fill="#0a0a0e" stroke="#6e6e78" stroke-width="1.6"/>
<rect x="626.4" y="312" width="211.20000000000002" height="26" rx="13" fill="#0a0a0e" stroke="#2e2e36"/>
<text x="732" y="329.5" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#f5f1eb" text-anchor="middle">reject: nothing is written</text>
