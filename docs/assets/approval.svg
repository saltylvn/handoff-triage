<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="420" viewBox="0 0 1170 420" role="img" aria-label="Rules flag an item, Slack asks a person, the person clicks approve, HubSpot is updated">
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#3d3d3d"/></pattern>
<marker id="grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8f8f"/></marker>
<marker id="rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff91ac"/></marker>
</defs>
<rect width="1170" height="420" fill="#161616"/>
<rect width="1170" height="420" fill="url(#dots)"/>
<text x="40" y="50" font-family="Menlo, Consolas, monospace" font-size="13" fill="#c4c4c4" letter-spacing="1.5">HUMAN APPROVAL</text>
<path d="M 835 231.0 C 877.0 231.0, 877.0 231.0, 919 231.0" fill="none" stroke="#8f8f8f" stroke-width="2" stroke-linecap="round" marker-end="url(#grey)"/>
<path d="M 540 231.0 C 582.0 231.0, 582.0 231.0, 624 231.0" fill="none" stroke="#ff91ac" stroke-width="2" stroke-linecap="round" marker-end="url(#rose)"/>
<path d="M 245 231.0 C 287.0 231.0, 287.0 231.0, 329 231.0" fill="none" stroke="#8f8f8f" stroke-width="2" stroke-linecap="round" marker-end="url(#grey)"/>
<text x="40" y="92" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#fafafa" font-weight="500">Flagged items write nothing until a person says yes.</text>
<rect x="40" y="185" width="205" height="92" rx="14" fill="#212121" stroke="#616161" stroke-width="1.5"/>
<text x="56" y="209" font-family="Menlo, Consolas, monospace" font-size="10" fill="#c4c4c4" letter-spacing="1">RULES IN CODE</text>
<text x="56" y="235" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600">Rules flag it</text>
<text x="56" y="256" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c4c4c4">unsure or risky</text>
<rect x="335" y="185" width="205" height="92" rx="14" fill="#212121" stroke="#616161" stroke-width="1.5"/>
<text x="351" y="209" font-family="Menlo, Consolas, monospace" font-size="10" fill="#c4c4c4" letter-spacing="1">CHAT</text>
<text x="351" y="235" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600">Slack asks</text>
<text x="351" y="256" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c4c4c4">approve or reject</text>
<rect x="630" y="185" width="205" height="92" rx="14" fill="#ffbcca" stroke="#ff91ac" stroke-width="1.5"/>
<text x="646" y="209" font-family="Menlo, Consolas, monospace" font-size="10" fill="#212121" letter-spacing="1">HUMAN IN THE LOOP</text>
<text x="646" y="235" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#212121" font-weight="600">A person decides</text>
<text x="646" y="256" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#212121">only listed approvers</text>
<rect x="925" y="185" width="205" height="92" rx="14" fill="#212121" stroke="#616161" stroke-width="1.5"/>
<text x="941" y="209" font-family="Menlo, Consolas, monospace" font-size="10" fill="#c4c4c4" letter-spacing="1">CRM · OAUTH 2.0</text>
<text x="941" y="235" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#fafafa" font-weight="600">HubSpot updated</text>
<text x="941" y="256" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c4c4c4">once, and logged</text>
<circle cx="245" cy="231.0" r="4.5" fill="#161616" stroke="#8f8f8f" stroke-width="2"/>
<circle cx="335" cy="231.0" r="4.5" fill="#161616" stroke="#8f8f8f" stroke-width="2"/>
