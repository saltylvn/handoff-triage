<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="620" viewBox="0 0 1170 620" role="img" aria-label="A contact form calls the API, which saves to a database. A worker takes items and calls Gemini, RDAP, HubSpot and Slack. Slack button clicks return to the API.">
