<marker id="rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#e879a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1170" height="560" fill="#0a0a0e"/>
<rect width="1170" height="560" fill="url(#dots)"/>
<circle cx="44" cy="51" r="3.5" fill="#e879a3"/>
