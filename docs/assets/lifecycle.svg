<text x="260" y="227.5" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#f5f1eb" text-anchor="middle">retry with backoff</text>
<rect x="364.2" y="494" width="81.6" height="26" rx="13" fill="#0a0a0e" stroke="#2e2e36"/>
<text x="405" y="511.5" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#f5f1eb" text-anchor="middle">approved</text>
