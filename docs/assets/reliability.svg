<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="520" viewBox="0 0 1170 520" role="img" aria-label="Five failures and how the system responds to each">
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#1b1b21"/></pattern>
<marker id="grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6e6e78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#e879a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1170" height="520" fill="#0a0a0e"/>
<rect width="1170" height="520" fill="url(#dots)"/>
<circle cx="44" cy="51" r="3.5" fill="#e879a3"/>
<text x="58" y="56" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#aaa6a2" letter-spacing="2">RELIABILITY</text>
<text x="40" y="104" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="36" fill="#f5f1eb" font-weight="600" letter-spacing="-0.8">One record, even when things fail.</text>
<text x="1130" y="496" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#aaa6a2" text-anchor="end" letter-spacing="0.4">fig. 03 — five layers against duplicates</text>
<text x="40" y="165" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#aaa6a2" letter-spacing="1.5">IF THIS HAPPENS</text>
<text x="620" y="165" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#aaa6a2" letter-spacing="1.5">THE SYSTEM</text>
<line x1="40" x2="1130" y1="180" y2="180" stroke="#2e2e36"/>
<text x="40" y="216" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#aaa6a2">The same webhook arrives twice</text>
<path d="M 500 210 L 590 210" fill="none" stroke="#e879a3" stroke-width="1.8" stroke-linecap="round" marker-end="url(#rose)"/>
<text x="620" y="216" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#f5f1eb" font-weight="600">A unique key ignores the copy</text>
<line x1="40" x2="1130" y1="238" y2="238" stroke="#2e2e36"/>
<text x="40" y="274" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#aaa6a2">The worker crashes midway</text>
<path d="M 500 268 L 590 268" fill="none" stroke="#e879a3" stroke-width="1.8" stroke-linecap="round" marker-end="url(#rose)"/>
<text x="620" y="274" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#f5f1eb" font-weight="600">It resumes at the unfinished step</text>
<line x1="40" x2="1130" y1="296" y2="296" stroke="#2e2e36"/>
<text x="40" y="332" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#aaa6a2">HubSpot&#x27;s reply gets lost</text>
<path d="M 500 326 L 590 326" fill="none" stroke="#e879a3" stroke-width="1.8" stroke-linecap="round" marker-end="url(#rose)"/>
<text x="620" y="332" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#f5f1eb" font-weight="600">Upsert updates the same contact</text>
<line x1="40" x2="1130" y1="354" y2="354" stroke="#2e2e36"/>
<text x="40" y="390" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#aaa6a2">Slack&#x27;s reply gets lost</text>
<path d="M 500 384 L 590 384" fill="none" stroke="#e879a3" stroke-width="1.8" stroke-linecap="round" marker-end="url(#rose)"/>
<text x="620" y="390" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#f5f1eb" font-weight="600">It finds the earlier post first</text>
<line x1="40" x2="1130" y1="412" y2="412" stroke="#2e2e36"/>
<text x="40" y="448" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#aaa6a2">An approver double-clicks</text>
<path d="M 500 442 L 590 442" fill="none" stroke="#e879a3" stroke-width="1.8" stroke-linecap="round" marker-end="url(#rose)"/>
<text x="620" y="448" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#f5f1eb" font-weight="600">Only the first click counts</text>
<line x1="40" x2="1130" y1="470" y2="470" stroke="#2e2e36"/>
</svg>
