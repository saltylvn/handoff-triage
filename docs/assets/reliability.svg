<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="520" viewBox="0 0 1170 520" role="img" aria-label="Five failures and how the system responds to each">
<defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#3d3d3d"/></pattern>
<marker id="grey" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8f8f8f"/></marker>
<marker id="rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff91ac"/></marker>
</defs>
<rect width="1170" height="520" fill="#161616"/>
<rect width="1170" height="520" fill="url(#dots)"/>
<text x="40" y="50" font-family="Menlo, Consolas, monospace" font-size="13" fill="#c4c4c4" letter-spacing="1.5">RELIABILITY</text>
<path d="M 500 442 L 590 442" fill="none" stroke="#ff91ac" stroke-width="2" stroke-linecap="round" marker-end="url(#rose)"/>
<path d="M 500 384 L 590 384" fill="none" stroke="#ff91ac" stroke-width="2" stroke-linecap="round" marker-end="url(#rose)"/>
<path d="M 500 326 L 590 326" fill="none" stroke="#ff91ac" stroke-width="2" stroke-linecap="round" marker-end="url(#rose)"/>
<path d="M 500 268 L 590 268" fill="none" stroke="#ff91ac" stroke-width="2" stroke-linecap="round" marker-end="url(#rose)"/>
<path d="M 500 210 L 590 210" fill="none" stroke="#ff91ac" stroke-width="2" stroke-linecap="round" marker-end="url(#rose)"/>
<text x="40" y="92" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#fafafa" font-weight="500">One record, even when things fail.</text>
<text x="40" y="165" font-family="Menlo, Consolas, monospace" font-size="12" fill="#c4c4c4" letter-spacing="1.5">IF THIS HAPPENS</text>
<text x="620" y="165" font-family="Menlo, Consolas, monospace" font-size="12" fill="#c4c4c4" letter-spacing="1.5">THE SYSTEM</text>
<line x1="40" x2="1130" y1="180" y2="180" stroke="#616161"/>
<text x="40" y="216" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c4c4c4">The same webhook arrives twice</text>
<text x="620" y="216" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#fafafa" font-weight="600">A unique key ignores the copy</text>
<line x1="40" x2="1130" y1="238" y2="238" stroke="#616161"/>
<text x="40" y="274" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c4c4c4">The worker crashes midway</text>
<text x="620" y="274" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#fafafa" font-weight="600">It resumes at the unfinished step</text>
<line x1="40" x2="1130" y1="296" y2="296" stroke="#616161"/>
<text x="40" y="332" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c4c4c4">HubSpot&#x27;s reply gets lost</text>
<text x="620" y="332" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#fafafa" font-weight="600">Upsert updates the same contact</text>
<line x1="40" x2="1130" y1="354" y2="354" stroke="#616161"/>
<text x="40" y="390" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c4c4c4">Slack&#x27;s reply gets lost</text>
<text x="620" y="390" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#fafafa" font-weight="600">It finds the earlier post first</text>
<line x1="40" x2="1130" y1="412" y2="412" stroke="#616161"/>
<text x="40" y="448" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c4c4c4">An approver double-clicks</text>
<text x="620" y="448" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#fafafa" font-weight="600">Only the first click counts</text>
<line x1="40" x2="1130" y1="470" y2="470" stroke="#616161"/>
</svg>
