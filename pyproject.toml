[project]
name = "human-in-the-loop-triage"
version = "0.1.0"
description = "Contact-us triage: LLM classification, enrichment, HubSpot, Slack, with human approval below a confidence threshold."
requires-python = ">=3.13"
dependencies = [
  "cryptography>=46",
  "email-validator>=2.2",
  "fastapi>=0.120",
  "httpx>=0.28",
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  "uvicorn>=0.38",
]

[dependency-groups]
dev = ["mypy>=1.18", "pip-audit>=2.9", "pytest>=8.4", "pytest-cov>=6", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]
"src/triage/evals/*" = ["S311"]
"src/triage/demo.py" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["triage"]
# Thin entry points that only start things, and the live eval runner.
omit = [
  "*/asgi.py",
  "*/worker.py",
  "*/connect_hubspot.py",
  "*/trace.py",
  "*/requeue.py",
  "*/send_sample.py",
  "*/demo.py",
  "*/wiring.py",
  "*/evals/run.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
